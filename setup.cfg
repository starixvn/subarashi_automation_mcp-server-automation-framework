[tool:pytest]
addopts = -v --tb=short
testpaths = tests

[mypy]
ignore_errors = True
disable_error_code = ALL

[flake8]
ignore = E,W,F,C,N,D,S,T,B,A,COM,EM,ICN,G,PIE,PT,RET,SIM,TID,ARG,PTH,ERA,PD,PGH,PL,TRY,NPY,RUF

[pylint]
disable = all

[pycodestyle]
ignore = all

[pydocstyle]
ignore = all

[bandit]
skips = all

[mccabe]
ignore = all 
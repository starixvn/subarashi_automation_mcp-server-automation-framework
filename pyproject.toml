[project]
name = "MCP_Server_Automation_Framework"
version = "0.1.0"
description = "MCP Server Automation Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.13",
    "aioodbc>=0.5.0",
    "anyio>=4.9.0",
    "asyncio-mqtt>=0.16.2",
    "asyncpg>=0.30.0",
    "bs4>=0.0.2",
    "fastapi>=0.115.12",
    "google-api-python-client>=2.172.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "google-genai>=1.20.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.8.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "playwright>=1.52.0",
    "pydantic>=2.11.4",
    "pydantic-core>=2.33.2",
    "pydantic-settings>=2.9.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.14.1",
    "python-dotenv>=1.1.0",
    "sse-starlette>=2.3.4",
    "starlette>=0.46.2",
    "streamlit>=1.45.1",
    "uvicorn>=0.34.2",
    "websockets>=15.0.1",
]

# Disable all type checkers and linters
[tool.mypy]
ignore_errors = true
disable_error_code = "ALL"

[tool.pyright]
typeCheckingMode = "off"

[tool.pylint]
disable = "all"

[tool.flake8]
disable = "all"

[tool.black]
skip-string-normalization = true

[tool.isort]
profile = "black"
skip = "**"

[tool.ruff]
ignore = ["E", "W", "F", "C", "N", "D", "S", "T", "B", "A", "COM", "EM", "ICN", "G", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]

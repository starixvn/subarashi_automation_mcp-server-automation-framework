version: '3.8'

services:
  # Production HTTP Server
  mcp-server-http:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
      - ./docker-config.json:/app/config/custom.json
    environment:
      - MCP_BROWSER_TYPE=chromium
      - MCP_HEADLESS=true
      - MCP_OUTPUT_DIR=/app/output
      - MCP_ISOLATED=true
    command: [
      "python", "main.py",
      "--config", "config/custom.json",
      "--transport", "http",
      "--host", "0.0.0.0",
      "--port", "5000"
    ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SSE Server for development
  mcp-server-sse:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./output:/app/output
    environment:
      - MCP_BROWSER_TYPE=chromium
      - MCP_HEADLESS=false
      - MCP_OUTPUT_DIR=/app/output
    command: [
      "python", "main.py",
      "--transport", "sse",
      "--host", "0.0.0.0", 
      "--port", "8080",
      "--vision",
      "--save-trace",
      "--caps", "core,vision,tabs,console,keyboard,network,files,testing,wait,pdf,api"
    ]

  # WebSocket Server
  mcp-server-ws:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./output:/app/output
    environment:
      - MCP_BROWSER_TYPE=chromium
      - MCP_HEADLESS=true
    command: [
      "python", "main.py",
      "--transport", "websocket",
      "--host", "0.0.0.0",
      "--port", "8765",
      "--headless",
      "--isolated"
    ]

  # Full-featured development server
  mcp-server-dev:
    build: .
    ports:
      - "9000:9000"
    volumes:
      - ./output:/app/output
      - ./traces:/app/traces
    environment:
      - MCP_BROWSER_TYPE=chromium
      - MCP_HEADLESS=false
      - MCP_OUTPUT_DIR=/app/output
    command: [
      "python", "main.py",
      "--transport", "http",
      "--host", "0.0.0.0",
      "--port", "9000",
      "--vision",
      "--save-trace",
      "--output-dir", "/app/output",
      "--caps", "core,vision,tabs,console,keyboard,network,files,testing,wait,pdf,api",
      "--viewport-size", "1920,1080",
      "--image-responses", "allow"
    ]

volumes:
  output:
  traces: 